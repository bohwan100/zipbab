<!DOCTYPE html>
<html lang="ko">
<head>

  <link rel="apple-touch-icon" href="https://bohwan100.github.io/zipbab/assets/icon.png">
  <title>🍳 곽경민님 전용 30끼 황금 레시피 | 집밥봇</title>
  <script>
    (function() {
      var ua = navigator.userAgent.toLowerCase();
      if (ua.indexOf('kakaotalk') !== -1) {
        if (/android/i.test(ua)) {
          location.href = 'intent://' + location.href.replace(/https?:\/\//i, '') + '#Intent;scheme=https;package=com.android.chrome;end';
        }

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #f97316;
      --primary-hover: #ea580c;
      --accent: #38bdf8;
      --success: #10b981;
      --bg: #090d16;
      --card-bg: rgba(26, 34, 53, 0.85);
      --card-border: rgba(59, 130, 246, 0.2);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }

    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 60%, #030712 100%);
      color: var(--text);
      line-height: 1.6;
      padding: 30px 20px 100px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
      padding: 35px 25px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .badge-top {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(249, 115, 22, 0.15);
      color: #fb923c;
      border: 1px solid rgba(249, 115, 22, 0.4);
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    header h1 {
      font-size: 2.3rem;
      font-weight: 800;
      background: linear-gradient(90deg, #fdba74, #f97316, #fb7185);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 30px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 20px;
      border-radius: var(--radius);
    }

    .cuisine-filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .btn-filter {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 9px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-filter:hover, .btn-filter.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.35);
    }

    .btn-cart-page {
      background: #0073e9;
      color: #fff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-cart-page:hover { background: #005bb5; }

    /* Clean Segmented Mode Selector */
    .view-mode-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 18px;
    }
    .view-mode-tabs {
      display: inline-flex;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }
    .view-mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 9px 18px;
      border-radius: 9px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .view-mode-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.35);
    }
    .view-mode-btn:hover:not(.active) {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    /* Week Timeline Bar */
    .week-timeline-bar {
      background: rgba(18, 24, 38, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
    }
    .week-chips {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .week-chip {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 9px 18px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .week-chip:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .week-chip.active {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      border-color: #f97316;
      color: #fff;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.4);
    }
    .week-summary-pill {
      font-size: 0.86rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.5;
    }
    .week-summary-pill strong {
      color: #38bdf8;
    }

    /* Cook Check Button */
    .btn-cook-check {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 4px 11px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .btn-cook-check:hover {
      background: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
      color: #34d399;
    }
    .btn-cook-check.cooked {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #34d399;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.25);
    }

    .recipe-card.is-cooked {
      border-color: rgba(16, 185, 129, 0.4) !important;
      background: rgba(16, 26, 28, 0.85);
    }
    .recipe-card.is-cooked .recipe-title {
      color: #94a3b8;
      text-decoration: line-through;
      text-decoration-color: #10b981;
      text-decoration-thickness: 2px;
    }

    /* Cooked Toast Banner */
    .cooked-toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(90px);
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: #ffffff;
      padding: 13px 24px;
      border-radius: 9999px;
      font-weight: 800;
      font-size: 0.95rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(16, 185, 129, 0.4);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      z-index: 99999;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .cooked-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 22px;
    }

    .recipe-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .recipe-card:hover {
      transform: translateY(-4px);
      border-color: rgba(249, 115, 22, 0.5);
      box-shadow: 0 15px 30px rgba(249, 115, 22, 0.15);
    }

    .highlight-recipe-card {
      border-color: #f97316 !important;
      box-shadow: 0 0 35px rgba(249, 115, 22, 0.75) !important;
      transform: translateY(-6px) scale(1.02);
      transition: all 0.4s ease;
      animation: pulseHighlight 2s ease infinite;
    }
    @keyframes pulseHighlight {
      0%, 100% { box-shadow: 0 0 25px rgba(249, 115, 22, 0.5); }
      50% { box-shadow: 0 0 45px rgba(249, 115, 22, 0.85); }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .day-badge {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .cuisine-tag {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .recipe-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .nutrition-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
    }

    .nutrition-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .cal-val { color: #fdba74; font-size: 1rem; }

    .macro-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .macro-item strong { display: block; font-size: 0.85rem; color: #fff; }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ingredient-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 14px;
    }
    .ing-tag {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #bae6fd;
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .ing-tag:hover {
      background: rgba(249, 115, 22, 0.22);
      border-color: rgba(249, 115, 22, 0.6);
      color: #fdba74;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(249, 115, 22, 0.35);
    }

    .recipe-steps {
      font-size: 0.88rem;
      color: #e2e8f0;
      margin-bottom: 16px;
      padding-left: 18px;
    }
    .recipe-steps li { margin-bottom: 5px; }

    .golden-tip {
      background: rgba(245, 158, 11, 0.1);
      border-left: 3px solid #f59e0b;
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 0.82rem;
      color: #fef3c7;
      margin-bottom: 14px;
    }
    .golden-tip strong { color: #fcd34d; }

    .waste-tag {
      font-size: 0.78rem;
      color: #34d399;
      background: rgba(16, 185, 129, 0.1);
      border: 1px dashed rgba(16, 185, 129, 0.4);
      padding: 6px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .search-box {
      position: relative;
      min-width: 250px;
    }
    .search-box input {
      width: 100%;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 9px 14px 9px 36px;
      border-radius: 20px;
      font-size: 0.9rem;
      outline: none;
      transition: border 0.2s;
    }
    .search-box input:focus { border-color: var(--primary); }
    .search-box span {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Top Global Sticky Navigation Bar */
    .top-nav {
      background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 12px 24px;
      margin-bottom: 24px;
    }
    .top-nav-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-weight: 800;
      font-size: 1.1rem;
    }
    .nav-brand-badge {
      background: rgba(249, 115, 22, 0.15);
      color: #fb923c;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      border: 1px solid rgba(249, 115, 22, 0.3);
    }
    .nav-links {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .nav-btn {
      padding: 8px 15px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
    }
    .nav-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .nav-btn.recipe:hover:not(.active) {
      border-color: rgba(249, 115, 22, 0.5);
      color: #fb923c;
      background: rgba(249, 115, 22, 0.1);
    }
    .nav-btn.cart:hover:not(.active) {
      border-color: rgba(56, 189, 248, 0.5);
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
    }
    .nav-btn.storage:hover:not(.active) {
      border-color: rgba(52, 211, 153, 0.5);
      color: #34d399;
      background: rgba(52, 211, 153, 0.1);
    }
    /* 3대 핵심 서비스 버튼 활성화 (주황색, 파란색, 초록색) */
    .nav-btn.orange.active, .nav-btn.recipe.active {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff !important;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.45);
    }
    .nav-btn.orange.active:hover, .nav-btn.recipe.active:hover {
      background: linear-gradient(135deg, #ea580c, #c2410c);
      transform: translateY(-1px);
    }
    .nav-btn.blue.active, .nav-btn.cart.active, .nav-btn.cyan.active {
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #fff !important;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.45);
    }
    .nav-btn.blue.active:hover, .nav-btn.cart.active:hover, .nav-btn.cyan.active:hover {
      background: linear-gradient(135deg, #0369a1, #0284c7);
      transform: translateY(-1px);
    }
    .nav-btn.green.active, .nav-btn.storage.active {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff !important;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.45);
    }
    .nav-btn.green.active:hover, .nav-btn.storage.active:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }
  
    
    /* Clean & Intuitive Step List Styling */
    .recipe-steps {
      list-style: none;
      counter-reset: step-counter;
      margin-bottom: 18px;
      padding-left: 0;
    }
    .recipe-steps li {
      position: relative;
      padding-left: 30px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #e2e8f0;
    }
    .recipe-steps li::before {
      counter-increment: step-counter;
      content: counter(step-counter);
      position: absolute;
      left: 0;
      top: 3px;
      width: 20px;
      height: 20px;
      background: rgba(249, 115, 22, 0.2);
      color: #fb923c;
      border: 1px solid rgba(249, 115, 22, 0.45);
      border-radius: 50%;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
</style>
</head>

    function setViewMode(mode) {
      currentViewMode = mode;
      document.getElementById('btn-mode-timeline').classList.toggle('active', mode === 'timeline');
      document.getElementById('btn-mode-all').classList.toggle('active', mode === 'all');
      
      const timelineBar = document.getElementById('week-timeline-bar');
      const categoryNav = document.getElementById('category-filter-nav');
      
      if (mode === 'timeline') {
        if (timelineBar) timelineBar.style.display = 'block';
        if (categoryNav) categoryNav.style.display = 'none';
      } else {
        if (timelineBar) timelineBar.style.display = 'none';
        if (categoryNav) categoryNav.style.display = 'flex';
      }
      
      renderRecipes();
    }

    function selectWeek(weekNum) {
      currentWeek = weekNum;
      for (let i = 1; i <= 4; i++) {
        const btn = document.getElementById(`btn-week-${i}`);
        if (btn) btn.classList.toggle('active', i === weekNum);
      }
      const summaryEl = document.getElementById('week-summary-pill');
      if (summaryEl && weekSummaries[weekNum]) {
        summaryEl.innerHTML = weekSummaries[weekNum];
      }
      renderRecipes();
    }

    function toggleCooked(day, ev) {
      if (ev) ev.stopPropagation();
      const key = `zipbab_cooked_day_${day}`;
      const now = localStorage.getItem(key) === 'true';
      const next = !now;
      try {
        localStorage.setItem(key, next ? 'true' : 'false');
      } catch (e) {}

      const card = document.getElementById(`day-${day}`);
      const btn = card ? card.querySelector('.btn-cook-check') : null;

      if (next) {
        if (btn) {
          btn.classList.add('cooked');
          btn.innerHTML = '✅ 조리 완료!';
        }
        if (card) card.classList.add('is-cooked');
        showCookedToast(`🎉 Day ${day} 집밥 성공! 배달비 22,000원 방어 완료 💰`);
      } else {
        if (btn) {
          btn.classList.remove('cooked');
          btn.innerHTML = '🍳 조리 완료';
        }
        if (card) card.classList.remove('is-cooked');
      }
    }

    function showCookedToast(msg) {
      let toast = document.getElementById('cooked-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'cooked-toast';
        toast.className = 'cooked-toast';
        document.body.appendChild(toast);
      }
      toast.innerText = msg;
      toast.classList.add('show');
      clearTimeout(window.__cookedToastTimer);
      window.__cookedToastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    function renderRecipes(cuisineFilter = null, searchQuery = null) {
      const container = document.getElementById('recipe-container');
      if (!container) return;
      container.innerHTML = '';

      if (cuisineFilter !== null) currentCuisineFilter = cuisineFilter;
      const searchInput = document.getElementById('recipe-search');
      const q = (searchQuery !== null ? searchQuery : (searchInput ? searchInput.value : '')).toLowerCase().trim();

      const dayNames = ['월', '화', '수', '목', '금', '토', '일'];

      const filtered = recipes.filter(r => {
        // 검색어가 있으면 전체 중에서 검색
        if (q) {
          return r.title.toLowerCase().includes(q) || 
                 r.ingredients.some(i => i.toLowerCase().includes(q)) ||
                 r.steps.some(s => s.toLowerCase().includes(q));
        }

        // 1. 주차별 타임라인 모드
        if (currentViewMode === 'timeline') {
          if (currentWeek === 1) return r.day >= 1 && r.day <= 7;
          if (currentWeek === 2) return r.day >= 8 && r.day <= 14;
          if (currentWeek === 3) return r.day >= 15 && r.day <= 21;
          if (currentWeek === 4) return r.day >= 22 && r.day <= 30;
          return true;
        }

        // 2. 전체 요리 일람 모드
        if (currentCuisineFilter === 'all') return true;
        return r.cuisine === currentCuisineFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #94a3b8;">
          <h3 style="font-size: 1.3rem; margin-bottom: 8px;">검색 결과가 없습니다 😢</h3>
          <p>다른 요리명이나 식재료를 검색해 보세요.</p>
        </div>`;
        return;
      }

      filtered.forEach(r => {
        const card = document.createElement('div');
        card.className = 'recipe-card';
        card.id = `day-${r.day}`;

        const dayOfWeek = dayNames[(r.day - 1) % 7];
        const isCooked = localStorage.getItem(`zipbab_cooked_day_${r.day}`) === 'true';
        if (isCooked) card.classList.add('is-cooked');

        card.innerHTML = `
          <div>
            <div class="card-header">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span class="day-badge">Day ${r.day} (${dayOfWeek}요일)</span>
                <span class="cuisine-tag">${r.flag}</span>
              </div>
              <button type="button" class="btn-cook-check ${isCooked ? 'cooked' : ''}" onclick="toggleCooked(${r.day}, event)" title="오늘 집밥 완료 체크">
                ${isCooked ? '✅ 조리 완료!' : '🍳 조리 완료'}
              </button>
            </div>
            <h2 class="recipe-title">${r.title}</h2>

            <!-- Nutrition -->
            <div class="nutrition-box">
              <div class="nutrition-header">
                <span>1명 정량 조리 (1인분) 기준</span>
                <span class="cal-val">${r.cal} kcal</span>
              </div>
              <div class="macro-row">
                <div class="macro-item">탄수화물<strong>${r.carb}g</strong></div>
                <div class="macro-item">단백질<strong>${r.prot}g</strong></div>
                <div class="macro-item">지방<strong>${r.fat}g</strong></div>
              </div>
            </div>

            <!-- Ingredients -->
            <div class="section-title">🥩 1명 정량 식재료</div>
            <div class="ingredient-tags">
              ${r.ingredients.map(i => {
                const safe = i.replace(/"/g, '&quot;');
                return `<span class="ing-tag" onclick="openIngredientLink('${safe}')" title="쿠팡 파트너스 추천 페이지 열기">${i}</span>`;
              }).join('')}
            </div>

            <!-- Steps -->
            <div class="section-title">🍳 10분 컷 조리 순서</div>
            <ol class="recipe-steps">
              ${r.steps.map(s => `<li>${s}</li>`).join('')}
            </ol>
          </div>

          <div>
            <!-- Zero Waste Tracker -->
            <div class="waste-tag">
              <span>♻️</span> <strong>식재료 100% 소진 트래커:</strong> ${r.waste}
            </div>
            <div style="margin-top: 10px; display: flex; justify-content: flex-end;">
              <a href="cart.html" style="font-size: 0.8rem; color: #f97316; text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 4px;" title="해당 요리 식재료 장바구니 매니저로 이동">
                장바구니 매니저에서 재료 담기 →
              </a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

    function searchRecipe() {
      const query = document.getElementById('recipe-search').value.trim();
      // 검색 중일 때는 전체 보기 모드로 유연하게 렌더링
      if (query && currentViewMode === 'timeline') {
        const timelineBar = document.getElementById('week-timeline-bar');
        if (timelineBar) timelineBar.style.display = 'none';
      } else if (!query && currentViewMode === 'timeline') {
        const timelineBar = document.getElementById('week-timeline-bar');
        if (timelineBar) timelineBar.style.display = 'block';
      }
      renderRecipes(currentCuisineFilter, query);
    }

    function initFilters() {
      const filterContainer = document.querySelector('.cuisine-filters');
      if (!filterContainer) return;
      const cuisines = {};
      recipes.forEach(r => {
        cuisines[r.cuisine] = (cuisines[r.cuisine] || 0) + 1;
      });
      const flagMap = {'한식': '🇰🇷', '일식': '🇯🇵', '중식': '🇨🇳', '양식': '🇪🇺', '동남아': '🥢'};
      let html = `<button class="btn-filter active" onclick="filterCuisine('all', this)">전체 (${recipes.length}끼)</button>`;
      for (const [c, count] of Object.entries(cuisines)) {
        const flag = flagMap[c] || '🍽️';
        html += `<button class="btn-filter" onclick="filterCuisine('${c}', this)">${flag} ${c} (${count}끼)</button>`;
      }
      filterContainer.innerHTML = html;
    }

    function filterCuisine(cuisine, btn) {
      document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      if (btn) {
        btn.classList.add('active');
      } else {
        const found = Array.from(document.querySelectorAll('.btn-filter')).find(b => b.innerText.includes(cuisine));
        if (found) found.classList.add('active');
      }
      currentCuisineFilter = cuisine;
      const searchVal = document.getElementById('recipe-search').value;
      renderRecipes(cuisine, searchVal);
    }

    function checkUrlTarget() {
      const params = new URLSearchParams(window.location.search);
      const dayParam = params.get('day');
      const hash = window.location.hash;
      let targetId = null;
      if (dayParam) {
        targetId = `day-${dayParam}`;
      } else if (hash && hash.startsWith('#day-')) {
        targetId = hash.substring(1);
      }

      if (targetId) {
        setTimeout(() => {
          const targetEl = document.getElementById(targetId);
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            targetEl.classList.add('highlight-recipe-card');
            setTimeout(() => {
              targetEl.classList.remove('highlight-recipe-card');
            }, 3500);
          }
        }, 200);
      }
    }

    // Coupang Partners Tracking & Affiliate Links
    let partnersLinks = {};
    fetch('/api/partners/links')
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .catch(() => fetch('data/partners_links_cache.json').then(r => r.json()))
      .then(data => { partnersLinks = data || {}; })
      .catch(e => console.warn('Partners links load warning:', e));

    function safeOpenUrl(url) {
      if (!url) return;
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        try { document.body.removeChild(a); } catch (e) {}
      }, 300);
    }

    function openIngredientLink(raw) {
      let clean = raw.replace(/\[[^\]]+\]/g, '')
                     .replace(/\([^)]*\)/g, '')
                     .replace(/[\d\.]+\s*(?:g|kg|ml|T|t|장|개|캔|모|봉|판|알|줌|단|쪽|줄|공기)/g, '')
                     .replace(/[\d\.\/]+/g, '')
                     .replace(/약간|조금|적당량|약|송송|한 꼬집|한 방울|톡톡/g, '')
                     .trim();
      if (!clean) clean = raw;

      // Check cache for query match
      let foundUrl = null;
      for (const [k, v] of Object.entries(partnersLinks)) {
        if (clean.includes(k) || k.includes(clean)) {
          foundUrl = v.shortenUrl;
          break;
        }
      }

      if (foundUrl) {
        safeOpenUrl(foundUrl);
        return;
      }

      // 모바일 또는 웹 배포 환경에서는 즉시 검색창 열기 (카카오톡 탈출 지원)
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile || (!window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1'))) {
        safeOpenUrl(`https://www.coupang.com/np/search?q=${encodeURIComponent(clean)}&channel=user`);
        return;
      }

      // PC 로컬 백엔드 구동 시 동적 파트너스 딥링크 생성 시도
      fetch('/api/partners/deeplink', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: clean })
      }).then(r => r.json()).then(res => {
        if (res.shortenUrl) {
          window.open(res.shortenUrl, '_blank');
        } else {
          window.open(`https://www.coupang.com/np/search?q=${encodeURIComponent(clean)}&channel=user`, '_blank');
        }
      }).catch(() => {
        window.open(`https://www.coupang.com/np/search?q=${encodeURIComponent(clean)}&channel=user`, '_blank');
      });
    }
    window.openIngredientLink = openIngredientLink;

    renderRecipes();
    initFilters();
    checkUrlTarget();
    window.addEventListener('hashchange', checkUrlTarget);
  </script>
  <div id="cooked-toast" class="cooked-toast"></div>
</body>
</html>
