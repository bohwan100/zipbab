name: 24/7 Threads AI Auto Poster & Milestone Monitor

on:
  schedule:
    # ⏰ 한국 시간(KST) 07:12 ~ 23:42 사이 30분 간격 고빈도 자가 복구 트리거 (UTC = KST - 9시간)
    # 깃허브 정각/5분 큐 병목을 완벽히 피하는 비혼잡 분(:12, :42) 설정 및 표준 POSIX 정렬
    - cron: '12,42 0-14 * * *'
    - cron: '12,42 22,23 * * *'

  # GitHub 웹사이트에서 언제든 'Run workflow' 버튼으로 즉시 수동 실행 가능
  workflow_dispatch:
    inputs:
      account:
        description: '발행할 대상 계정'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - only_apples0.1
          - ggul_bamm

jobs:
  auto-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Execute Scheduled Threads Post & Milestone Check
        env:
          ONLY_APPLES_SESSION_ID: ${{ secrets.ONLY_APPLES_SESSION_ID }}
          ONLY_APPLES_USER_ID: ${{ secrets.ONLY_APPLES_USER_ID }}
          GGUL_BAMM_SESSION_ID: ${{ secrets.GGUL_BAMM_SESSION_ID }}
          GGUL_BAMM_USER_ID: ${{ secrets.GGUL_BAMM_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_scheduled_slot.py --account "${{ github.event.inputs.account || 'both' }}" ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Commit & Push Learning History Back to Repo
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted_history.json data/tracked_my_posts.json || true
          git commit -m "Auto: Update posted history and view tracking [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed or no changes"
